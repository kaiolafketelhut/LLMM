name: mirror-to-demo-repository
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to demo-repository
        env:
          KEY: ${{ secrets.DEMO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_mirror
          chmod 600 ~/.ssh/id_mirror
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_mirror -o IdentitiesOnly=yes" git push --force git@github.com:Colegio-San-Caio/demo-repository.git HEAD:refs/heads/index-html-mirror
